services:
  grafana:
    image: grafana/grafana:12.4.0
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      TZ: America/Belem
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  grafana_data:
    name: grafana_data
